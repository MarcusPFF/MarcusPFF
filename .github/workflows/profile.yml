name: Update Profile

on:
  # Every 15 minutes so the intro's time and status stay current
  # (offset from the top of the hour, when scheduled runs queue up the most)
  schedule:
    - cron: "7,22,37,52 * * * *"
  # Allow manual triggering of the workflow
  workflow_dispatch:
  # Trigger the workflow on pushes to the main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk/svg-only@v3
        with:
          # GitHub username to generate the animation for
          github_user_name: ${{ github.repository_owner }}
          # Define the output files and their configurations
          outputs: |
            dist/github-snake.svg?color_snake=#9333ea
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#9333ea
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Live Intro
        run: node .github/scripts/intro.mjs dist
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          # Keep a single commit on the branch instead of 96 new ones a day
          force_orphan: true
          # Optionally, you can set a custom commit message
          commit_message: "Update profile images [skip ci]"
